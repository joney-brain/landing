name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the first deploy be triggered from the Actions tab.
  workflow_dispatch:

# Only one deploy at a time; never cancel a live one, just queue.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read      # checkout
  pages: write        # upload the artefact
  id-token: write     # ask GitHub for a deployment token

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` = tsc -> vite build -> SSR pre-render -> robots/sitemap.
      # SITE_URL falls back to the registered domain in site.config.mjs; set a
      # repository variable named SITE_URL to override it.
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Fail loudly rather than shipping a site whose copy or links drifted.
      - name: Audit the built site
        run: python3 scripts/audit.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
