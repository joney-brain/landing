<!doctype html>
<!--
  Open Graph card source. Rendered to a 1200x630 bitmap by
  scripts/make-og.mjs using the site's own compiled stylesheet, so the preview
  card can never drift from the real design. Not part of the shipped site.
-->
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="__CSS__" />
    <style>
      /* Fixed canvas: no scrolling, no layout surprises. */
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .og {
        display: grid;
        grid-template-columns: 1fr 372px;
        height: 630px;
      }
      .og__body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 68px 64px 60px 72px;
      }
      .og__name {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 96px;
        line-height: 0.9;
        letter-spacing: -0.03em;
        margin: 0;
      }
      .og__role {
        font-size: 27px;
        font-weight: 300;
        line-height: 1.36;
        letter-spacing: -0.01em;
        color: var(--color-foreground);
        max-width: 24ch;
        margin: 0;
      }
      .og__foot {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .og__rule {
        display: block;
        width: 72px;
        height: 3px;
        background: var(--color-accent);
      }
      .og__plate {
        position: relative;
        overflow: hidden;
        border-left: 1px solid var(--color-border);
      }
      .og__plate img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 52% 30%;
        display: block;
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div class="og">
      <div class="og__body">
        <div>
          <p class="eyebrow">Редактор, контент-стратег, руководитель проектов</p>
          <h1 class="og__name">Евгений<br />Колесников</h1>
        </div>

        <div>
          <p class="og__role">
            Создаю контент для бизнеса: от посадочных страниц до
            <span style="white-space: nowrap">IT&#8209;блогов</span>
          </p>
          <div class="og__foot" style="margin-top: 38px">
            <span class="og__rule"></span>
            <span style="font-size: 20px; font-weight: 500">15+ лет в медиа</span>
          </div>
        </div>
      </div>

      <div class="og__plate">
        <img src="/assets/portrait-hero.webp" alt="" />
      </div>
    </div>
  </body>
</html>
